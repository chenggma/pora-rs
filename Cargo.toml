[package]
name = "pora-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust core for the PORA collision-risk metric hot loop (PyO3 bindings)"

[lib]
name = "pora_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
rayon = "1.12"

[profile.release]
lto = true
codegen-units = 1
